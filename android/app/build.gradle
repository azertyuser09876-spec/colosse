plugins {
    id 'com.android.application'
}
android {
    namespace 'io.github.azertyuser09876spec.colosse'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.azertyuser09876spec.colosse'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '1.8.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signature de débogage : l'APK s'installe directement. Pour le Play Store, remplacez par votre propre clé.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
